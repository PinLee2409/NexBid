# EN: Scrapes the backend's metrics (spec §34) from its management port, which only this network can reach.
# VI: Lấy metric của backend (spec §34) từ cổng quản trị, cổng mà chỉ mạng nội bộ này truy cập được.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nexbid
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8090"]
