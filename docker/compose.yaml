# EN: Local infrastructure. Postgres is on 55432 because 5432 and 5433 are both taken on this machine;
#     Redis and Kafka follow the same pattern on 56379 and 59092.
# VI: Hạ tầng chạy local. Postgres ở cổng 55432 vì 5432 và 5433 trên máy này đều đã bị chiếm;
#     Redis và Kafka theo cùng cách, ở cổng 56379 và 59092.
#
# EN: On a contested port Docker may bind only the IPv6 half, and localhost then reaches the wrong server.
# VI: Khi cổng bị tranh chấp, Docker có thể chỉ bind được phía IPv6, và localhost sẽ trỏ nhầm server khác.
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml down        # keeps data / giữ dữ liệu
#   docker compose -f docker/compose.yaml down -v     # drops data / xoá luôn dữ liệu
services:
  postgres:
    image: postgres:17-alpine
    container_name: nexbid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexbid
      POSTGRES_USER: nexbid
      POSTGRES_PASSWORD: nexbid
      # EN: Fixed collation, so ORDER BY does not depend on the host locale.
      # VI: Cố định collation, để ORDER BY không phụ thuộc locale của máy.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "55432:5432"
    volumes:
      - nexbid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # EN: Must mean "accepting queries", not merely "process started".
      # VI: Phải có nghĩa là "nhận được truy vấn", không chỉ là "tiến trình đã chạy".
      test: ["CMD-SHELL", "pg_isready -U nexbid -d nexbid"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # EN: A cache, not a store (spec §20): nothing is persisted, and when memory fills the least-used keys go.
  # VI: Là cache, không phải kho lưu trữ (spec §20): không lưu xuống đĩa, và khi đầy bộ nhớ thì bỏ khoá ít dùng nhất.
  redis:
    image: redis:7-alpine
    container_name: nexbid-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # EN: The event log (spec §19). One node in KRaft mode, no ZooKeeper. Data lives in the container: it
  #     survives a restart but not `down`, which is fine locally since events are consumed within moments.
  # VI: Nhật ký sự kiện (spec §19). Một node chạy KRaft, không cần ZooKeeper. Dữ liệu nằm trong container:
  #     còn sau khi restart nhưng mất khi `down`, ở local không sao vì sự kiện được xử lý gần như ngay.
  kafka:
    image: apache/kafka-native:4.2.1
    container_name: nexbid-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # EN: Two doors: HOST for the app on this machine, DOCKER for containers on the compose network.
      # VI: Hai cửa: HOST cho app chạy trên máy này, DOCKER cho các container trong mạng compose.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:59092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # EN: A single node cannot keep more than one copy of anything.
      # VI: Một node thì không thể giữ nhiều hơn một bản sao.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "59092:9092"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  nexbid-postgres-data:
