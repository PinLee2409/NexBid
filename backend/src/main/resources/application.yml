# EN: Local development config. Every value can be overridden by an environment variable.
# VI: Cấu hình chạy local. Mọi giá trị đều có thể override bằng biến môi trường.
spring:
  application:
    name: nexbid

  datasource:
    # EN: 127.0.0.1 and port 55432 — see docker/compose.yaml for why.
    # VI: Dùng 127.0.0.1 và cổng 55432 — lý do xem trong docker/compose.yaml.
    url: ${NEXBID_DB_URL:jdbc:postgresql://127.0.0.1:55432/nexbid}
    username: ${NEXBID_DB_USER:nexbid}
    password: ${NEXBID_DB_PASSWORD:nexbid}

  jpa:
    hibernate:
      # EN: The schema belongs to migrations, never to Hibernate guessing.
      # VI: Schema thuộc về migration, không bao giờ để Hibernate tự đoán.
      ddl-auto: ${NEXBID_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      # EN: Two limits: one file, and the whole request. A gallery upload sends several at once.
      # VI: Hai giới hạn: một file, và cả request. Màn tải ảnh gửi nhiều tấm cùng lúc.
      max-file-size: ${NEXBID_MAX_IMAGE_BYTES:5MB}
      max-request-size: 25MB

  jackson:
    # EN: ISO-8601 UTC, not epoch millis — the client parses these with new Date().
    # VI: ISO-8601 theo UTC, không phải epoch millis — client parse bằng new Date().
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: UTC

  data:
    redis:
      host: ${NEXBID_REDIS_HOST:127.0.0.1}
      port: ${NEXBID_REDIS_PORT:56379}
      # EN: Short on purpose: a cache that answers slowly is worse than no cache at all.
      # VI: Cố ý để ngắn: cache trả lời chậm còn tệ hơn là không có cache.
      timeout: 250ms
      connect-timeout: 250ms
      # EN: Redis holds cache entries only; every repository here is JPA.
      # VI: Redis chỉ giữ dữ liệu cache; mọi repository ở đây đều là JPA.
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${NEXBID_KAFKA_SERVERS:127.0.0.1:59092}
    producer:
      properties:
        # EN: Give up quickly when Kafka is down. Nothing is lost: the event stays in the outbox for a retry.
        # VI: Bỏ cuộc sớm khi Kafka sập. Không mất gì: sự kiện vẫn nằm trong outbox chờ gửi lại.
        max.block.ms: 2000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      # EN: A new consumer group starts at the oldest event, not just the ones after it joined.
      # VI: Consumer group mới bắt đầu từ sự kiện cũ nhất, không chỉ những sự kiện tới sau khi nó tham gia.
      auto-offset-reset: earliest
    admin:
      # EN: Creating topics at startup must not hold the app hostage when Kafka is down.
      # VI: Việc tạo topic lúc khởi động không được bắt app chờ mãi khi Kafka sập.
      operation-timeout: 5s
      close-timeout: 1s
    properties:
      # EN: While Kafka is down, knock every 10 s rather than every second — the relay waits that long anyway.
      # VI: Khi Kafka sập, 10 giây mới gõ cửa một lần thay vì mỗi giây — relay vốn cũng chờ ngần ấy.
      reconnect.backoff.max.ms: 10000

server:
  port: ${NEXBID_PORT:8080}
  error:
    # EN: Error bodies are the contract in spec §28; Tomcat's own page must never show through.
    # VI: Body lỗi là hợp đồng ở spec §28; không được để trang lỗi mặc định của Tomcat lọt ra.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # EN: Which component failed is operational detail, not for the public probe.
      # VI: Thành phần nào hỏng là thông tin vận hành, không công khai ở probe.
      show-details: never
  health:
    redis:
      # EN: A cache outage is not an outage (spec §20) — the probe must not report the app as down for it.
      # VI: Cache sập không phải là app sập (spec §20) — probe không được báo app hỏng vì chuyện đó.
      enabled: false

nexbid:
  cache:
    # EN: How long a lot's unchanging details stay cached. Nothing that bidding changes is ever cached.
    # VI: Thông tin không đổi của một lô được giữ trong cache bao lâu. Không thứ gì mà việc trả giá làm thay đổi được cache.
    lot-ttl: ${NEXBID_LOT_CACHE_TTL:10m}
    # EN: After Redis fails, stop asking it for this long instead of paying a timeout on every request.
    # VI: Sau khi Redis lỗi, thôi hỏi nó trong khoảng này thay vì mỗi request phải chịu một lần timeout.
    retry-after: 10s

  rate-limit:
    bids:
      # EN: Spec §20.2: 10 bid requests per 10 seconds per person, in any sliding 10-second window.
      # VI: Spec §20.2: 10 request trả giá mỗi 10 giây mỗi người, trong bất kỳ khung trượt 10 giây nào.
      limit: ${NEXBID_BID_RATE_LIMIT:10}
      window: ${NEXBID_BID_RATE_WINDOW:10s}

  kafka:
    relay:
      # EN: A commit wakes the relay at once; this poll only catches what a missed wake-up left behind.
      # VI: Commit đánh thức relay ngay; lượt quét này chỉ gom những gì bị sót khi không được đánh thức.
      interval: 1s
      batch-size: 200
      # EN: After Kafka fails, how long events wait in the outbox before the next try.
      # VI: Sau khi Kafka lỗi, sự kiện nằm chờ trong outbox bao lâu trước lần thử tiếp.
      retry-after: 10s
      send-timeout: 10s
    # EN: One thread per partition of nexbid.auctions. / VI: Mỗi partition của nexbid.auctions một luồng.
    consumer-concurrency: 3
    # EN: Kafka keeps events 7 days by default; after that none can be delivered again.
    # VI: Mặc định Kafka giữ sự kiện 7 ngày; sau đó không sự kiện nào có thể được giao lại nữa.
    consumed-retention: 7d
    prune-interval: 3600000

  web:
    # EN: Origins allowed to open the realtime socket. The handshake checks this even though WebSocket
    #     itself ignores CORS, so a stray page cannot quietly attach to the feed.
    # VI: Các origin được phép mở socket realtime. Bước bắt tay vẫn kiểm dù bản thân WebSocket bỏ qua CORS,
    #     nên một trang lạ không thể lặng lẽ bám vào luồng tin.
    allowed-origins: ${NEXBID_ALLOWED_ORIGINS:http://localhost:3000}

  scheduler:
    # EN: Off switch for background work, e.g. when a second instance must not run the clock twice.
    # VI: Công tắc tắt tác vụ nền, ví dụ khi instance thứ hai không được chạy đồng hồ lần nữa.
    enabled: ${NEXBID_SCHEDULER_ENABLED:true}
    # EN: How long a lot can sit past its start or end time before the scheduler acts, at worst.
    # VI: Thời gian tối đa một lô có thể nằm quá giờ mở hoặc giờ đóng trước khi scheduler xử lý.
    interval: ${NEXBID_SCHEDULER_INTERVAL_MS:5000}
    batch-size: 200

  notification:
    # EN: How far ahead watchers hear "opens soon" / "closes soon" — the catalogue's own "ending soon".
    # VI: Người theo dõi được báo "sắp mở" / "sắp đóng" trước bao lâu — đúng như "sắp đóng" của danh mục.
    heads-up: ${NEXBID_HEADS_UP:1h}
    heads-up-interval: ${NEXBID_HEADS_UP_INTERVAL_MS:60000}

  payment:
    # EN: How long a winner has to pay, counted from the close. Matches the frontend's demo data.
    # VI: Người thắng có bao lâu để trả, tính từ lúc đóng phiên. Khớp với dữ liệu demo của frontend.
    window: ${NEXBID_PAYMENT_WINDOW:48h}
    expiry-interval: ${NEXBID_PAYMENT_EXPIRY_INTERVAL_MS:60000}

  storage:
    # EN: Outside the source tree — uploads are data, not code, and must never reach a commit.
    # VI: Nằm ngoài cây mã nguồn — ảnh tải lên là dữ liệu chứ không phải mã, không được lọt vào commit.
    images-dir: ${NEXBID_IMAGES_DIR:var/images}
    max-image-bytes: ${NEXBID_MAX_IMAGE_BYTES:5242880}
    public-path: /media/products

  bootstrap:
    # EN: Accounts to be granted these roles at startup. Empty by default; set NEXBID_ADMIN_EMAILS for a dev admin.
    # VI: Các tài khoản được cấp vai trò này lúc khởi động. Mặc định trống; đặt NEXBID_ADMIN_EMAILS để có admin cho dev.
    admin-emails: ${NEXBID_ADMIN_EMAILS:}
    seller-emails: ${NEXBID_SELLER_EMAILS:}

  jwt:
    # EN: Development default only. Any real deployment must pass NEXBID_JWT_SECRET; HMAC-SHA256 needs 32+ bytes.
    # VI: Chỉ là giá trị mặc định cho dev. Môi trường thật bắt buộc truyền NEXBID_JWT_SECRET; HMAC-SHA256 cần từ 32 byte.
    secret: ${NEXBID_JWT_SECRET:nexbid-local-development-secret-key-change-me}
    # EN: Short enough to limit a stolen token, long enough not to interrupt a bidding session.
    # VI: Đủ ngắn để hạn chế thiệt hại nếu token bị lấy, đủ dài để không cắt ngang một phiên đấu giá.
    expiry: ${NEXBID_JWT_EXPIRY:2h}
    issuer: nexbid

logging:
  level:
    com.nexbid: ${NEXBID_LOG_LEVEL:DEBUG}
    # EN: Kafka's clients print their whole config, and every reconnect attempt, at INFO.
    # VI: Client của Kafka in toàn bộ cấu hình, và mọi lần thử kết nối lại, ở mức INFO.
    org.apache.kafka: WARN
    # EN: Logs each failed send with its full payload; the relay already reports the failure once.
    # VI: Ghi mỗi lần gửi hỏng kèm toàn bộ payload; relay đã báo lỗi đó một lần rồi.
    org.springframework.kafka.support.LoggingProducerListener: OFF
