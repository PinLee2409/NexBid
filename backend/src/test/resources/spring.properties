# EN: Every test context brings its own Postgres, Redis and Kafka containers, and a cached context keeps
#     them running. With the default of 32 the whole suite's containers ran at once, until Kafka could no
#     longer start. Six keeps the classes that share a context fast and the rest within Docker's memory.
# VI: Mỗi test context có Postgres, Redis và Kafka riêng, và context còn trong cache thì container vẫn
#     chạy. Với mặc định 32, container của cả bộ test chạy cùng lúc, tới mức Kafka không khởi động nổi.
#     Sáu vẫn giữ nhanh cho các class dùng chung context, còn lại nằm trong giới hạn bộ nhớ của Docker.
spring.test.context.cache.maxSize=6
