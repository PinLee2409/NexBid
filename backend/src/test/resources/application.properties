# EN: Test uploads stay under target/, away from the photos the dev app serves from var/images.
# VI: Ảnh tải lên trong test nằm dưới target/, tách khỏi ảnh mà app dev phục vụ từ var/images.
nexbid.storage.images-dir=target/test-images

# EN: Existing tests count the platform fee from a seller's first sale; the waiver has its own test.
# VI: Các test có sẵn tính phí sàn ngay từ giao dịch đầu; phần miễn phí có test riêng.
nexbid.payout.new-seller-free-sales=0
# EN: Push tests post to a local fake push service. / VI: Test push gửi tới một dịch vụ push giả chạy local.
nexbid.push.allow-any-host=true

# EN: Tests never reach the public rate feed. / VI: Test không bao giờ gọi nguồn tỷ giá công khai.
nexbid.fx.enabled=false
